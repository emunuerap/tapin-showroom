<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />

    <!-- Brand favicon: yuzu dot on obsidian -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050505'/%3E%3Ccircle cx='32' cy='40' r='10' fill='%23CCFF00'/%3E%3C/svg%3E"
    />

    <title>TapIn — The Hospitality OS</title>
    <meta
      name="description"
      content="The first sentient Hospitality OS. It doesn't wait for orders — it anticipates desire. Don't call. Just TapIn."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TapIn — The Hospitality OS" />
    <meta
      property="og:description"
      content="Don't call. Just TapIn. The first sentient Hospitality OS — anticipating desire, eliminating friction."
    />
    <meta property="og:site_name" content="TapIn" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TapIn — The Hospitality OS" />
    <meta
      name="twitter:description"
      content="Don't call. Just TapIn. The first sentient Hospitality OS."
    />

    <!--
      NOTE: The dark obsidian showroom uses system fallbacks (sans-serif /
      serif / monospace) declared in tailwind.config.js — it references none
      of the families below, so its look is unchanged.

      Fraunces (display) + Hanken Grotesk (sans) are the deliberate type pair
      for the light-immersive redesign (/redesign, .tapin-light scope). This
      is the "later phase, validated" font step the previous note anticipated.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-obsidian">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
